services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/__pycache__/
    environment:
      FLASK_APP: api.py
      FLASK_DEBUG: "1"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge