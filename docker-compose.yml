version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app        
      - /app/node_modules     s
    command: sh -c "npm install && npm run dev -- --host" 
    environment:
      CHOKIDAR_USEPOLLING: "true" 

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app       
      - /app/__pycache__/       
    environment:
      FLASK_APP: api.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_DEBUG: "1"         
    command: sh -c "pip install -r requirements.txt && flask run --host=0.0.0.0"

volumes:
  node_modules:          
